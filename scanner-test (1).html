<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner Test</title>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<style>
:root{--bg:#F2F5F8;--s:#fff;--ink:#13202B;--mut:#586977;--line:#D9E1E8;--acc:#1550D6;--good:#0B7A48;--bad:#BC2430}
@media (prefers-color-scheme:dark){:root{--bg:#0D141A;--s:#151E26;--ink:#E7EEF4;--mut:#93A3B1;--line:#27333E;--acc:#7AA7FF;--good:#4FD18F;--bad:#FF8A92}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.p{background:var(--s);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
video{width:100%;border-radius:8px;background:#000;max-height:46vh;object-fit:cover}
button,.btn{font:inherit;border:0;border-radius:8px;padding:11px 16px;font-weight:600;background:var(--acc);color:#fff;cursor:pointer;display:inline-block;position:relative;overflow:hidden}
button.l,.btn.l{background:none;border:1px solid var(--line);color:var(--ink)}
button.g{background:var(--good)} button.b{background:var(--bad)}
.btn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.big{font:600 24px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.mut{color:var(--mut);font-size:13px}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.tally b{display:block;font-size:22px}
.log div{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>
<h1>Barcode scanner test</h1>
<div class="p">
  <video id="v" playsinline muted></video>
  <div class="row">
    <button id="start">Start camera</button>
    <button class="l" id="stop" hidden>Stop</button>
    <button class="l" id="torch" hidden>Light</button>
    <label class="btn l">Take photo of barcode<input id="photo" type="file" accept="image/*" capture="environment"></label>
  </div>
  <div class="mut" id="msg">Tap Start camera, or take a photo of one barcode. Fill the screen with the barcode, 10 to 15 cm away, with good light.</div>
  <div class="mut" id="dbg"></div>
</div>
<div class="p" id="res" hidden>
  <div class="mut">Last scan</div>
  <div class="big" id="code"></div>
  <div class="mut">Compare it with the number printed under the barcode.</div>
  <div class="row"><button class="g" id="ok">Sahi</button><button class="b" id="bad">Galat</button></div>
</div>
<div class="p">
  <div class="tally"><div><b id="tS">0</b><span class="mut">Scans</span></div><div><b id="tR">0</b><span class="mut">Sahi</span></div><div><b id="tW">0</b><span class="mut">Galat</span></div><div><b id="tP">-</b><span class="mut">Accuracy</span></div></div>
  <div class="row"><button class="l" id="reset">Reset</button></div>
</div>
<div class="p log" id="log"></div>
<script>
(function(){
function $(i){return document.getElementById(i)}
var v=$('v'),msg=$('msg'),dbg=$('dbg');
var pending=null,lastCode='',lastAt=0,n={s:0,r:0,w:0},rows=[];
var detector=null,engine='',stream=null,track=null,loopOn=false,frames=0,zx=null,torchOn=false;

function tally(){
  $('tS').textContent=n.s;$('tR').textContent=n.r;$('tW').textContent=n.w;
  var j=n.r+n.w;$('tP').textContent=j?Math.round(n.r/j*100)+'%':'-';
  $('log').innerHTML=rows.slice().reverse().map(function(r){return '<div><span>'+r.c+'</span><span style="color:var(--'+(r.ok?'good':'bad')+')">'+(r.ok?'Sahi':'Galat')+'</span></div>'}).join('');
}
function onCode(c){
  var now=Date.now(); if(pending) return; if(c===lastCode&&now-lastAt<2500) return;
  lastCode=c;lastAt=now;pending=c;n.s++;$('code').textContent=c;$('res').hidden=false;
  if(navigator.vibrate)navigator.vibrate(60); tally();
}
function judge(ok){ if(!pending) return; rows.push({c:pending,ok:ok}); if(ok)n.r++; else n.w++; pending=null; $('res').hidden=true; tally(); }
$('ok').onclick=function(){judge(true)}; $('bad').onclick=function(){judge(false)};
$('reset').onclick=function(){n={s:0,r:0,w:0};rows=[];pending=null;$('res').hidden=true;tally()};

/* choose the best engine: the phone's own detector first, ZXing as backup */
function pickEngine(){
  if('BarcodeDetector' in window){
    try{ detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39']}); engine='Phone detector'; return; }catch(e){ detector=null; }
  }
  engine=window.ZXing?'ZXing backup':'none';
}
pickEngine();
dbg.textContent='Scanner: '+engine+(engine==='ZXing backup'?' (the phone detector is not available in this browser)':'');

function stopAll(){
  loopOn=false;
  if(zx){ try{zx.reset()}catch(e){} zx=null; }
  if(stream){ stream.getTracks().forEach(function(t){t.stop()}); stream=null; track=null; }
  v.srcObject=null;
  $('stop').hidden=true;$('torch').hidden=true;$('start').hidden=false;
}
$('stop').onclick=function(){ stopAll(); msg.textContent='Stopped.'; };

async function startDetectorLoop(){
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});
  track=stream.getVideoTracks()[0];
  try{
    var caps=track.getCapabilities?track.getCapabilities():{};
    if(caps.focusMode&&caps.focusMode.indexOf('continuous')>=0) await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    if(caps.torch) $('torch').hidden=false;
  }catch(e){}
  v.srcObject=stream; await v.play();
  loopOn=true; frames=0;
  (async function loop(){
    while(loopOn){
      try{
        if(v.readyState>=2){
          var found=await detector.detect(v); frames++;
          if(found&&found.length) onCode(found[0].rawValue);
        }
      }catch(e){}
      await new Promise(function(r){setTimeout(r,90)});
    }
  })();
  var t=setInterval(function(){ if(!loopOn){clearInterval(t);return} dbg.textContent='Scanner: '+engine+' · frames checked: '+frames+' · video '+v.videoWidth+'x'+v.videoHeight; },500);
}
function startZxing(){
  var H=ZXing.BarcodeFormat,hints=new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[H.EAN_13,H.EAN_8,H.UPC_A,H.UPC_E,H.CODE_128,H.CODE_39]);
  hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
  zx=new ZXing.BrowserMultiFormatReader(hints);
  return zx.decodeFromConstraints({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}}},v,function(r){ if(r) onCode(r.getText()); });
}
$('start').onclick=async function(){
  if(!window.isSecureContext){msg.textContent='Camera needs a secure (https) page. Open the hosted link, not a saved file.';return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){msg.textContent='This browser cannot open the camera here. Use Take photo of barcode.';return}
  msg.textContent='Starting camera...';
  try{
    if(detector) await startDetectorLoop();
    else if(window.ZXing) await startZxing();
    else { msg.textContent='No scanner available. Check the internet and reload.'; return; }
    msg.textContent='Scanning. Fill the screen with one barcode, hold steady.';
    $('start').hidden=true;$('stop').hidden=false;
  }catch(e){ msg.textContent='Camera did not start: '+(e&&e.name||'error')+'. Allow camera access and try again.'; stopAll(); }
};
$('torch').onclick=async function(){
  if(!track) return; torchOn=!torchOn;
  try{ await track.applyConstraints({advanced:[{torch:torchOn}]}); }catch(e){ msg.textContent='Light is not supported on this phone.'; }
};

/* photo mode: full-resolution still picture from the camera app */
$('photo').addEventListener('change',async function(){
  var f=this.files&&this.files[0]; this.value=''; if(!f) return;
  msg.textContent='Reading photo...';
  var code=null;
  try{
    if(detector){
      var bmp=await createImageBitmap(f); var r=await detector.detect(bmp); if(r&&r.length) code=r[0].rawValue;
    }
    if(!code&&window.ZXing){
      var url=URL.createObjectURL(f);
      try{
        var H=ZXing.BarcodeFormat,hints=new Map();
        hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[H.EAN_13,H.EAN_8,H.UPC_A,H.UPC_E,H.CODE_128,H.CODE_39]);
        hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
        var rd=new ZXing.BrowserMultiFormatReader(hints); var res=await rd.decodeFromImageUrl(url); code=res.getText();
      }catch(e){} finally{ URL.revokeObjectURL(url); }
    }
  }catch(e){}
  if(code){ msg.textContent='Photo read.'; lastCode=''; onCode(code); }
  else msg.textContent='Barcode not read from the photo. Take it again with only the barcode filling the picture, straight on, in good light.';
});
tally();
})();
</script>
</body>
</html>
